[build]
  base = "netlify-site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Keep source resolution and video downloads on the existing persistent relay.
# The CDN proxy avoids a new serverless invocation and signing-key read per chunk.
[[redirects]]
  from = "/stream/live/*"
  to = "https://web-production-dc68f.up.railway.app/stream/live/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
