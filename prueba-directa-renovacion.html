<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de reproducción directa</title><style>body{font:17px system-ui;margin:20px;background:#f5f5f7}video{width:100%;max-height:75vh;background:#000}button,select{padding:12px}</style><h1>Prueba directa y renovación</h1><p>Vídeo del proveedor al navegador. Sin intermediario de vídeo.</p><select id="channel"><option value="1e0a326e31ef5153eef9db32">ESPN 2</option><option value="5f9ca59581f773d33c3a5929">ESPN 6</option><option value="5f8652f6be4fc65ba4ffa069">DSports</option></select><button id="play">Reproducir</button><button id="refresh">Renovar enlace</button><p id="status">Preparado</p><video controls playsinline></video><script src="/hls.min.js"></script><script type="module">import {createLivePlayer} from './live-player.js?v=20261109a';let player;const video=document.querySelector('video'),status=document.querySelector('#status');async function start(refresh=false){player?.destroy();const id=document.querySelector('#channel').value;player=createLivePlayer({video,Hls:window.Hls,onStatus:t=>status.textContent=t,resolveSource:async(_,signal,{refresh:renew})=>{const r=await fetch('/api.php?a=direct&source='+id+((refresh||renew)?'&refresh=1':''),{signal,cache:'no-store'});refresh=false;const data=await r.json();if(!r.ok)throw Object.assign(Error(data.error),{status:r.status,code:data.code});return data;}});await player.start();}document.querySelector('#play').onclick=()=>start();document.querySelector('#refresh').onclick=()=>start(true);</script></html>
