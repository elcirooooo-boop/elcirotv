<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba de manifiesto con Referer</title><style>body{font:18px system-ui;margin:20px}video{width:100%;max-height:70vh;background:#000}button{padding:12px}</style><h1>Solo manifiesto por Hostinger</h1><p>Los fragmentos se solicitan directamente al proveedor.</p><button id="play">Probar ESPN 2</button><p id="status">Preparado</p><video controls playsinline></video><script src="/hls.min.js"></script><script>document.querySelector('#play').onclick=()=>{const video=document.querySelector('video'),status=document.querySelector('#status');status.textContent='Conectando';const hls=new Hls({manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:1});hls.loadSource('/prueba-manifiesto-20261109.php?channel=espn2&mode=manifest');hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,e)=>{if(e.fatal)status.textContent='Error: '+e.details+'; HTTP '+(e.response?.code||'sin respuesta');});video.onplaying=()=>status.textContent='Reproduciendo';};</script></html>
